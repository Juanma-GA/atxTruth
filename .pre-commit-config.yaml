# AACF G1: pre-commit hooks that can reject a commit (secrets, lint, forbidden patterns).
#   backend/.venv: pip install --require-hashes -r backend/requirements-dev.lock.txt  (includes pre-commit)
#   pre-commit install
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (package-lock\.json|requirements.*\.lock\.txt|^aacf/|^sources/)
  - repo: local
    hooks:
      - id: forbidden-patterns
        name: forbidden patterns (HR1, HR15, colours, __future__ in routes, Windows safety)
        entry: node scripts/check-forbidden.mjs
        language: system
        pass_filenames: false
        files: ^(frontend/src|backend/app|scripts)/
      - id: ruff
        name: ruff check + format (backend, version from the lockfile)
        entry: node scripts/backend.mjs ruff
        language: system
        pass_filenames: false
        files: ^backend/
      - id: eslint
        name: eslint (frontend)
        entry: node frontend/node_modules/eslint/bin/eslint.js --max-warnings 0 --config frontend/eslint.config.js
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
