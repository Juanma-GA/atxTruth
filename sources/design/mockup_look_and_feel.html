<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Standard Migrator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: desktop tool shell. Top bar, workflow rail on the left, workspace on the right; panes scroll inside a fixed-height app. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --sunk:#f6f8fb; --ink:#152132; --muted:#566275; --line:#d6dce5; --line2:#e6eaf0;
  --accent:#173f7a; --accent-ink:#ffffff; --accent-soft:#e3ebf7; --focus:#2563eb;
  --ok:#1f7a45; --ok-soft:#e1f2e8; --warn:#9a5a00; --warn-soft:#fdf0d8; --bad:#b42318; --bad-soft:#fde7e5;
  --t-blue:#2f6fd6; --t-orange:#e0701a; --t-green:#2b9150; --t-grey:#6f7a8a; --t-purple:#7a4bd0; --t-teal:#11878a; --t-brown:#8d5a2a; --t-yellow:#c49a00; --t-light:#aab2be;
  --code-tag:#173f7a; --code-attr:#8d5a2a; --code-val:#1f7a45; --code-com:#7d8796;
  --f-ui:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-head:"IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#151c26; --sunk:#111821; --ink:#e4e9f0; --muted:#9aa6b6; --line:#2a3544; --line2:#212a36;
  --accent:#8db0ff; --accent-ink:#0b1220; --accent-soft:#1d2a40; --focus:#8db0ff;
  --ok:#5cc98a; --ok-soft:#14301f; --warn:#f0b54a; --warn-soft:#33270f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --t-blue:#6c9cf0; --t-orange:#f39a4f; --t-green:#5cc07e; --t-grey:#98a3b3; --t-purple:#a98bf0; --t-teal:#43c1c3; --t-brown:#c99562; --t-yellow:#e6c23e; --t-light:#6b7584;
  --code-tag:#8db0ff; --code-attr:#e0b07a; --code-val:#7fd6a0; --code-com:#7d8796; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#151c26; --sunk:#111821; --ink:#e4e9f0; --muted:#9aa6b6; --line:#2a3544; --line2:#212a36;
  --accent:#8db0ff; --accent-ink:#0b1220; --accent-soft:#1d2a40; --focus:#8db0ff;
  --ok:#5cc98a; --ok-soft:#14301f; --warn:#f0b54a; --warn-soft:#33270f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --t-blue:#6c9cf0; --t-orange:#f39a4f; --t-green:#5cc07e; --t-grey:#98a3b3; --t-purple:#a98bf0; --t-teal:#43c1c3; --t-brown:#c99562; --t-yellow:#e6c23e; --t-light:#6b7584;
  --code-tag:#8db0ff; --code-attr:#e0b07a; --code-val:#7fd6a0; --code-com:#7d8796; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
svg{width:16px;height:16px;flex:none}
.stepbtn .n svg{width:13px;height:13px}
.banner svg{width:18px;height:18px;color:var(--ok)}
.demo .io svg{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
/* top bar */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:30px;width:auto}
.brand b{font-family:var(--f-head);font-size:18px;font-weight:600;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.crumb{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
.crumb strong{color:var(--ink);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:500;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px;min-height:34px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:28px;padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
/* body grid */
.main{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}
.rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.rail h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px;font-family:var(--f-ui);font-weight:600}
.stepbtn{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:var(--r);cursor:pointer;min-height:40px;width:100%}
.stepbtn .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.stepbtn .l{font-size:13.5px;line-height:1.25}
.stepbtn .l small{display:block;color:var(--muted);font-size:11.5px}
.stepbtn[aria-current="step"]{background:var(--accent-soft)}
.stepbtn[aria-current="step"] .n{border-color:var(--accent);color:var(--accent)}
.stepbtn.done .n{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.stepbtn:disabled{cursor:not-allowed;opacity:.5}
.work{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
.hint b{color:var(--warn);font-weight:600;white-space:nowrap}
.page{padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;min-height:0;flex:1}
.page.full{padding-bottom:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h2{font-size:22px}
.head p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card > .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card > .ch h3{font-size:15px}
.card > .cb{padding:14px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.plain{border-color:var(--line);color:var(--muted)}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--sunk);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.grid tr.sel td{background:var(--accent-soft)}
table.grid tr.click{cursor:pointer}
table.grid tr.click:hover td{background:var(--sunk)}
.tw{overflow-x:auto;max-width:100%}
/* home */
.home{max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.homehead{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end}
.homehead h1{font-size:34px;line-height:1.1}
.homehead p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.flow{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.flow span{border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--panel);color:var(--muted)}
.demos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.demo{display:flex;flex-direction:column;gap:10px;padding:16px;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);min-height:44px}
.demo:hover{border-color:var(--accent)}
.demo .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.demo h2{font-size:20px}
.demo .io{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:12.5px}
.demo .io div{border:1px solid var(--line2);background:var(--sunk);border-radius:4px;padding:6px 8px;min-width:0}
.demo .io b{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.demo ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.demo .go{margin-top:auto;font-weight:600;color:var(--accent);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* settings */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:6px 8px;min-height:34px;min-width:0;width:100%}
.codeparts{display:flex;flex-wrap:wrap;gap:4px}
.codeparts input{width:auto;min-width:0;text-align:center;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:5px 4px;min-height:32px}
.filepick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.filepick .path{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:6px 8px;min-height:34px;font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filepick .path.empty{color:var(--muted);font-family:var(--f-ui)}
.cirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.cirbox{border:1px solid var(--line2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cirbox h4{margin:0;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.cirlist{max-height:150px;overflow:auto;font-size:12.5px;border-top:1px solid var(--line2);padding-top:6px}
.cirlist div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;padding:2px 0}
.footbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
/* standards */
.stds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.std{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.std b{font-family:var(--f-head);font-size:17px;font-weight:600}
.std small{color:var(--muted)}
.std[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
/* import */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--panel)}
.fileicon{width:46px;height:56px;border-radius:4px;display:grid;place-items:end center;padding-bottom:6px;font-weight:700;font-size:11px;color:#fff;flex:none}
.fileicon.pdf{background:#b42318}.fileicon.docx{background:#2b579a}
.stages{display:flex;flex-direction:column;gap:2px}
.stage{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r)}
.stage .ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.stage.run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.stage.done .ic{background:var(--ok);border-color:var(--ok)}
.stage.done .ic::after{content:"";width:8px;height:4px;border:2px solid var(--panel);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.stage b{font-weight:600}
.stage small{display:block;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.stage.run .ic{animation:none}}
pre.json,pre.xml{margin:0;font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--sunk);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;overflow:auto;white-space:pre}
/* review workspace */
.ws{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;flex:1;min-height:520px}
.ws.three{grid-template-columns:220px minmax(0,1.05fr) minmax(0,1fr)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane > .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.pane > .ph h3{font-size:14px}
.pane > .pb{overflow:auto;min-height:0;flex:1;position:relative}
.doc{padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.pg{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);line-height:0}
.pg img{width:100%;height:auto;display:block}
.pg .pn{position:absolute;right:6px;top:6px;line-height:1.2;font-size:11px;background:rgba(20,30,45,.75);color:#fff;border-radius:3px;padding:1px 6px}
.ov{position:absolute;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);cursor:pointer;padding:0;border-radius:2px}
.ov:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.ov.pend{border-style:dashed;border-width:2px}
.ov.sel{outline:3px solid var(--c);outline-offset:2px;background:color-mix(in srgb,var(--c) 24%,transparent);z-index:2}
.ov.dim{opacity:.25}
.ov .tag{position:absolute;left:-1.5px;top:-15px;line-height:1;font-size:9.5px;font-weight:600;background:var(--c);color:#fff;padding:2px 4px;border-radius:2px 2px 0 0;white-space:nowrap;display:none}
.ov.sel .tag,.ov.pend .tag{display:block}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 12px 8px 0;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;cursor:pointer;width:100%}
.row:hover{background:var(--sunk)}
.row.sel{background:var(--accent-soft)}
.row .bar{align-self:stretch;background:var(--c)}
.row .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .ty{font-size:11.5px;font-weight:600;color:var(--c);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .ty .st{color:var(--muted);font-weight:500}
.row .tt{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .cf{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.meter{width:54px;height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.mid i{background:var(--warn)}.meter.low i{background:var(--bad)}
.insp{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel);max-height:48%;overflow:auto}
.insp .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.insp .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12.5px}
.insp .kv dt{color:var(--muted)}
.insp .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.similar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:8px 10px;font-size:13px}
.similar svg{width:18px;height:18px;flex:none;color:var(--accent)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.counters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tree{display:flex;flex-direction:column;padding:6px}
.tree button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:0;background:transparent;border-radius:4px;padding:8px;cursor:pointer;min-height:44px}
.tree button[aria-current="true"]{background:var(--accent-soft)}
.tree button small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.tree .grp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 8px 2px}
/* segmentation */
.secs{display:flex;flex-direction:column;gap:8px;padding:10px}
.sec{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.sec.flag{border-color:var(--warn);border-left-color:var(--c);background:var(--warn-soft)}
.sec .t{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.sec .t b{font-size:14px}
.sec .m{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;font-size:12px}
.sec .m span{color:var(--muted)}
.sec select{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:3px 6px;min-height:30px;font-size:12px;max-width:100%}
.bound{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--c);z-index:3;pointer-events:none}
.bound span{position:absolute;left:4px;top:-17px;line-height:1.2;font-size:10px;font-weight:600;background:var(--c);color:#fff;padding:1px 5px;border-radius:2px;white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis}
.pmtree{font-size:13px;display:flex;flex-direction:column;gap:4px;padding:4px 10px 12px}
.pmtree .e{font-weight:600;margin-top:4px}
.pmtree .d{padding-left:16px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
/* xml */
.xmlwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;flex:1;min-height:480px}
.xmlwrap pre.xml{height:100%;border:0;border-radius:0}
.xt{color:var(--code-tag)}.xa{color:var(--code-attr)}.xv{color:var(--code-val)}.xc{color:var(--code-com);font-style:italic}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto}
.uselist{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.uselist .u{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.uselist .u code{font-family:var(--f-mono);font-size:11px;background:var(--sunk);border:1px solid var(--line2);border-radius:3px;padding:0 4px;white-space:nowrap}
.filetabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line2)}
.filetabs button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 8px;font-family:var(--f-mono);font-size:11px;cursor:pointer;min-height:28px}
.filetabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:var(--r);padding:10px 12px;font-size:13px}
.banner.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.banner.bad{background:var(--bad-soft);border:1px solid var(--bad)}
/* validation */
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chk{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--line)}
.chk.ok{border-top-color:var(--ok)}.chk.bad{border-top-color:var(--bad)}.chk.run{border-top-color:var(--accent)}
.chk b{font-family:var(--f-head);font-size:17px;font-weight:600}
.chk .res{font-size:13px}
.errs{display:flex;flex-direction:column;gap:6px}
.err{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line2);border-left:4px solid var(--bad);border-radius:4px;padding:8px 10px;font-size:13px;background:var(--panel)}
/* publish */
.pubv{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;flex:1;min-height:520px}
.pubmain{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);overflow:auto;display:flex;justify-content:center;padding:16px}
.pubmain img{max-width:min(100%,760px);height:auto;box-shadow:0 1px 4px rgba(0,0,0,.25);background:#fff;align-self:flex-start}
.thumbs{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:2px}
.thumbs button{border:2px solid transparent;padding:0;background:transparent;cursor:pointer;border-radius:3px;line-height:0;position:relative}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:auto;background:#fff}
.thumbs span{position:absolute;bottom:3px;right:3px;line-height:1.2;font-size:10px;background:rgba(20,30,45,.75);color:#fff;padding:0 4px;border-radius:2px}
/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-head);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.stack{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--line2)}
.stack i{display:block;height:100%}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,26,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:520px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:1100px){
  .ws.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ws.three > .treepane{grid-column:1 / -1;max-height:220px}
  .xmlwrap{grid-template-columns:minmax(0,1fr)}
  .homehead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .rail h3{display:none}
  .stepbtn{width:auto;flex:none}
  .stepbtn .l small{display:none}
  .work{overflow:visible}
  .demos,.checks{grid-template-columns:minmax(0,1fr)}
  .ws,.ws.three{grid-template-columns:minmax(0,1fr);min-height:0}
  .ws .pane{max-height:75vh}
  .pubv{grid-template-columns:minmax(0,1fr)}
  .thumbs{flex-direction:row;overflow-x:auto}
  .thumbs button{flex:none;width:90px}
  .xmlwrap pre.xml{max-height:60vh}
}

.opt{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:58px}
.opt b{font-size:14px}

.dmpick table.grid td,.dmpick table.grid th{padding:5px 8px}

.win{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:70;padding:16px}
.win .w{width:100%;max-width:1000px;height:min(560px,calc(100% - 32px));background:#f3f3f3;color:#1b1b1b;border:1px solid #9a9a9a;border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.4);display:grid;grid-template-rows:auto auto 1fr auto;font-family:"Segoe UI",var(--f-ui);font-size:13px;overflow:hidden;color-scheme:light}

.win td{padding:5px 10px;white-space:nowrap;cursor:default}

.win .ficon.xml{background:#6b8e23}.win .ficon.xlsx{background:#1d6f42}.win .ficon.pdf{background:#c4302b}.win .ficon.docx{background:#2b579a}.win .ficon.dir{background:#e8b84a}

/* ================= v3: AI engine (proposals + judge) ================= */
function stepNum(text){ const m=text.match(/^(\d+(?:\.\d+)+)/); return m?m[1]:null; }
function aiProposalFor(b){
  const R = t('rs'); const ex = b.expected || {};
  if(ex.type==='warning' || /^(WARNING|ADVERTENCIA)/i.test(b.text)){
    const good = matchCIR(b.text,'warning') || ex.cir_ref; const wrong = (DN()==='2' && b.id==='b032') ? 'W001' : null;
    return {type:'warning', cir: wrong||good, conf: wrong?0.71:0.94, reasons:R.warn(wrong||good), sources:['CIR 0A4','BREX','DMs 4.2']};
  }
  if(ex.type && /^step/.test(ex.type)){ const num = stepNum(b.text)||''; const lv = TYPES[ex.type].lv;
    return {type:ex.type, conf:0.92, reasons:R.step(num,lv), sources:['XSD proced.xsd','BREX','DMs 4.2']}; }
  return {type:b.detected_type, conf:0.88, reasons:R.gen(), sources:['XSD']};
}
function judgeFor(b, p){
  const R = t('rs'); const checks = [['xsd',true],['brex',true],['ref',true]];
  if(p.type==='warning'){ const good = matchCIR(b.text,'warning'); const ok = !good || good===p.cir; checks.splice(2,0,['cir',ok]);
    if(!ok) return {ok:false, checks, text:R.jBad(p.cir, good), fix:{cir:good}}; }
  return {ok:true, checks, text:R.jOk};
}
function aiStats(d){ return {acc:d.blocks.filter(b=>b.ai==='accepted').length, rej:(d.aiRej||0), judged:(d.aiJudged||0)}; }

/* ================= assistant ================= */
function chatHTML(){
  const sug = (t('sug')[S.view==='task'&&S.cur?DN():'gen'])||t('sug').gen;
  return `<aside class="chat" aria-label="${t('asT')}"><div class="chh"><span class="iconbtn" aria-hidden="true">${IC.chat}</span><div style="flex:1;min-width:0"><b>${t('asT')}</b><small>${t('asSub')}</small><label class="sotmini"><input type="checkbox" id="as-sot" ${S.ai.sot?'checked':''}> <b>${t('sot')}</b> · <span style="color:${S.ai.sot?'var(--ok)':'var(--muted)'}">${S.ai.sot?t('asSot'):t('asNoSot')}</span></label></div><button class="iconbtn" id="as-x" aria-label="${t('close')}">${IC.x}</button></div>
   <div class="msgs" id="as-m">${[{who:'bot',html:esc(t('asHello'))}].concat(S.chat.msgs).map(msgHTML).join('')}${S.chat.busy?`<div class="msg bot"><span class="typing"><i></i><i></i><i></i></span></div>`:''}</div>
   <div class="cin"><div class="chips">${sug.map(s=>`<button data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
   <form id="as-f"><input id="as-i" placeholder="${esc(t('asPh'))}" autocomplete="off" aria-label="${esc(t('asPh'))}"><button class="btn primary" aria-label="${t('asSend')}">${IC.send}</button></form></div></aside>`;
}
function msgHTML(m, i){ return `<div class="msg ${m.who}">${m.html}${m.acts&&m.acts.length?`<div class="acts">${m.acts.map((a,k)=>`<button class="btn small ${a.primary?'primary':''}" data-act="${i-1}:${k}">${esc(a.label)}</button>`).join('')}</div>`:''}</div>`; }
function bindChat(){
  const m = document.getElementById('as-m'); m.scrollTop = m.scrollHeight;
  document.getElementById('as-x').onclick = () => { S.chat.open=false; render(); };
  const ss=document.getElementById('as-sot'); if(ss) ss.onchange=()=>{ S.ai.sot=ss.checked; refreshChat(); renderWork(); };
  document.querySelectorAll('.chips [data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
  document.getElementById('as-f').onsubmit = e => { e.preventDefault(); const v=document.getElementById('as-i').value.trim(); if(v) ask(v); };
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const [mi,ai]=b.dataset.act.split(':').map(Number); const a=S.chat.msgs[mi]&&S.chat.msgs[mi].acts[ai]; if(a) a.run(); });
}
function refreshChat(){ const old=document.querySelector('.chat'); if(!old) return; const tmp=document.createElement('div'); tmp.innerHTML=chatHTML(); old.replaceWith(tmp.firstElementChild); bindChat(); }
function ask(q){ S.chat.msgs.push({who:'me', html:esc(q)}); S.chat.busy=true; refreshChat(); setTimeout(()=>{ S.chat.busy=false; S.chat.msgs.push(answer(q)); refreshChat(); }, 750); }
const STOP = new Set('que qué cual cuál cuales es son el la los las de del en un una y o a por para con this the a an of in on is are which what find search busca buscar me dame hay en este esta esto usa use uses does do for to from it its'.split(' '));
function tokens(s){ return norm(s).split(/[^a-z0-9-]+/).filter(x=>x && x.length>2 && !STOP.has(x)); }
function searchCIR(q, kindOnly){
  const c = L().cir; const qt = tokens(q); const qn = norm(q); const out=[];
  ['tools','spares','supplies','warnings','cautions'].forEach(k=>{ if(kindOnly && k!==kindOnly) return; c[k].forEach(x=>{ let sc=0;
    if(qn.includes(norm(x.id))) sc+=10; if(x.pn && qn.includes(norm(x.pn))) sc+=10;
    const words = tokens((x.name||'')+' '+(x.text||'')); qt.forEach(w=>{ if(words.includes(w)) sc+=1; else if(w.length>4 && words.some(z=>z.startsWith(w.slice(0,5)))) sc+=0.5; });
    if(sc>=1) out.push(Object.assign({kind:k, sc}, x)); }); });
  return out.sort((a,b)=>b.sc-a.sc);
}
function kindHint(q){ const n=norm(q); if(/herramient|tool|equip/.test(n)) return 'tools'; if(/consumib|supply|supplies|liquid|fluid|grasa|grease/.test(n)&&!/advert|warn/.test(n)) return 'supplies'; if(/pieza|repuesto|spare|part/.test(n)) return 'spares'; if(/advert|warning/.test(n)) return 'warnings'; if(/precauc|caution/.test(n)) return 'cautions'; return null; }
function selBlock(){ if(!(S.view==='task'&&S.cur&&S.step==='review')) return null; const d=D(); return d.blocks.find(b=>b.id===d.sel)||null; }
function compatible(b, kind){ if(!b) return false; const ty=b.detected_type; if(kind==='warnings') return ['para','warning','note'].includes(ty); if(kind==='cautions') return ['para','caution','note'].includes(ty); return cirKindOfType(ty)===kind; }
function applyItem(b, item){ const d=D();
  if(item.kind==='warnings'||item.kind==='cautions'){ const ty=item.kind==='warnings'?'warning':'caution'; b.detected_type=ty; b.style=TYPES[ty].s; b.s1000d_element=TYPES[ty].e; b.cir_ref=item.id; }
  else if(b.cir_refs){ if(!b.cir_refs.includes(item.id)) b.cir_refs=b.cir_refs.concat(item.id); } else b.cir_ref=item.id;
  if(isPend(b)) b.status='ok'; b.human=true; b.confidence=1; if(REVIEW_API && S.step==='review') REVIEW_API.refresh(); }
function answer(q){
  const n = norm(q); const lgc = L(); const inTask = S.view==='task' && S.cur;
  if(/resuelv|resolve|propon|propose/.test(n)){ if(!S.ai.sot) return {who:'bot', html:esc(t('asNeedSot'))}; if(!inTask) return {who:'bot', html:esc(t('asSolveNone'))};
    const p = D().blocks.filter(b=>isPend(b)&&!b.aiProp); if(!p.length) return {who:'bot', html:esc(t('asSolveNone'))};
    p.forEach(b=>{ b.aiProp=aiProposalFor(b); }); if(REVIEW_API && S.step==='review') REVIEW_API.refresh();
    return {who:'bot', html:esc(t('asSolve')(p.length))+`<div style="display:flex;flex-direction:column;gap:4px">${p.slice(0,8).map(b=>`<div class="it"><code>${b.id}</code><span>${esc(tn(b.detected_type))} → <b>${esc(tn(b.aiProp.type))}</b>${b.aiProp.cir?' · '+b.aiProp.cir:''}</span></div>`).join('')}</div>`,
      acts:[{label:t('asFirst'), primary:true, run:()=>{ const d=D(); d.sel=p[0].id; if(S.step!=='review') go('review'); else if(REVIEW_API) REVIEW_API.select(p[0].id); }}]}; }
  if(/pendient|pending/.test(n) && inTask){ const p = D().blocks.filter(isPend);
    return {who:'bot', html:esc(t('asPend')(p.length))+(p.length?`<div style="display:flex;flex-direction:column;gap:4px">${p.slice(0,8).map(b=>`<div class="it"><code>${b.id}</code><span>${esc(b.text.slice(0,70))}</span></div>`).join('')}</div>`:''),
      acts:p.slice(0,4).map(b=>({label:t('asGo')(b.id), run:()=>{ const d=D(); d.sel=b.id; d.filter='pend'; if(DN()==='3'&&b.data_module) d.curDM=b.data_module; if(S.step!=='review') go('review'); else renderWork(); }}))}; }
  if(/brex|regla|rule/.test(n)) return {who:'bot', html:esc(t('asBrex'))+`<div style="display:flex;flex-direction:column;gap:4px">${DATA.brex.map(r=>`<div class="it"><code>${r.id.replace('BRDP-','')}</code><span>${esc(r.text[S.lang])}</span></div>`).join('')}</div>`};
  if(/solo|only|aplicab|applic/.test(n) && /gt|\be\b|aplicab|applic|version/.test(n)){ const sp = lgc.cir.spares.filter(x=>x.applic.length===1);
    return {who:'bot', html:esc(t('asApplicT'))+`<div style="display:flex;flex-direction:column;gap:4px">${sp.map(x=>`<div class="it"><code>${x.id}</code><span>${esc(x.name)} · <b>${x.applic[0]}</b></span></div>`).join('')}</div>`}; }
  if(/modulo de datos|data module|info code|dmc|dmrl/.test(n)){ const qt=tokens(q).filter(w=>!/modulo|module|datos|data|info|code|dmc|dmrl/.test(w)); const rows=lgc.dmrl.filter(r=>{ const z=tokens(r.tech+' '+r.info); return qt.filter(w=>z.some(y=>y.startsWith(w.slice(0,5)))).length>=1; }).slice(0,5);
    if(rows.length) return {who:'bot', html:esc(t('asDmrl'))+`<div style="display:flex;flex-direction:column;gap:4px">${rows.map(r=>`<div class="it"><code>${r.dmc.slice(-6,-3)}</code><span>${esc(r.tech)} – ${esc(r.info)}<br><span class="mono muted" style="font-size:11px">${esc(r.dmc)}</span></span></div>`).join('')}</div>`}; }
  // supplies/tools used by a data module of the current task ("which supplies does the bleeding use?")
  const kh = kindHint(q);
  if(inTask && kh && DN()==='3'){ const qt=tokens(q); const s = D().sections.find(sc=>{ const z=tokens(sc.section+' '+sc.tech_name+' '+sc.info_name); return qt.some(w=>z.some(y=>y.startsWith(w.slice(0,5)))); });
    if(s){ const ids=new Set(); D().blocks.filter(b=>b.data_module===s.dmc).forEach(b=>(b.cir_refs||(b.cir_ref?[b.cir_ref]:[])).forEach(i=>{ const it=cirItem(i); if(it&&it.kind===kh) ids.add(i); }));
      if(ids.size) return {who:'bot', html:esc(t('asFound')(ids.size))+` <span class="muted">(${esc(s.section)})</span><div style="display:flex;flex-direction:column;gap:4px">${[...ids].map(i=>{ const x=cirItem(i); return `<div class="it"><code>${i}</code><span>${esc(x.name||x.text)}${x.pn?` · <span class="mono">${x.pn}</span>`:''}</span></div>`; }).join('')}</div>`}; } }
  // the CIR item used by this DM (demo 1 warning)
  if(inTask && /usa|use|uses/.test(n) && kh){ const ids=[...usedCIR()].map(cirItem).filter(x=>x&&x.kind===kh); if(ids.length) return {who:'bot', html:esc(t('asFound')(ids.length))+`<div style="display:flex;flex-direction:column;gap:4px">${ids.map(x=>`<div class="it"><code>${x.id}</code><span>${esc(x.name||x.text)}</span></div>`).join('')}</div>`}; }
  let res = searchCIR(q, kh); if(!res.length && kh) res = searchCIR(q);
  if(res.length){ const top=res.slice(0,3); const b = selBlock();
    return {who:'bot', html:esc(t('asFound')(top.length))+`<div style="display:flex;flex-direction:column;gap:4px">${top.map(x=>`<div class="it"><code>${x.id}</code><span>${esc(clip(x.name||x.text,140))}${x.pn?` · <span class="mono">${x.pn}</span>`:''}</span></div>`).join('')}</div>`+(b?`<span class="muted" style="font-size:12px">${t('asSel')}: <b class="mono">${b.id}</b></span>`:''),
      acts: b ? top.filter(x=>compatible(b,x.kind)).map((x,k)=>({label:t('asApply')(x.id), primary:k===0, run:()=>{ applyItem(b,x); S.chat.msgs.push({who:'bot', html:esc(t('asApplied')(x.id,b.id))}); refreshChat(); toast(t('cirChanged')(x.id)); }})) : []}; }
  const b = selBlock(); if(b && /bloque|block|esto|this/.test(n)){ const ty=TYPES[b.detected_type]||TYPES.para; return {who:'bot', html:esc(t('asBlock')(b.id, tn(b.detected_type), ty.e))}; }
  return {who:'bot', html:esc(t('asNo'))};
}

render();
})();

</script>
